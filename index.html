<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>娃娃機台平面圖</title>
<!-- PWA：可加到主畫面 -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111418">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="娃娃機台">
<style>
  :root{
    --bg:#111418; --panel:#1c2128; --line:#2c333d; --text:#e8ecf1; --muted:#9aa4b2;
    --paid:#1f9d55; --unpaid:#d64545; --exch:#c62828; --accent:#3b82f6;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  header{padding-top:calc(10px + env(safe-area-inset-top)) !important;position:relative;top:0;z-index:5;background:rgba(17,20,24,.95);backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);padding:10px 12px}
  .bar{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  h1{font-size:18px;margin:0}
  .actions{display:flex;gap:6px;flex-wrap:wrap}
  button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--text);
    padding:6px 10px;border-radius:8px;cursor:pointer}
  button:hover,.btn:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .summary{max-width:640px;margin:8px auto 0;display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .summary b{color:var(--text)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  main{padding:10px 8px 30px}
  .floor{position:relative;width:min(100%,640px);margin:0 auto;aspect-ratio:400/860;
    container-type:inline-size;background:#0b0d10;border:1px solid var(--line);border-radius:12px}
  .item{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:1.6cqw;overflow:hidden;text-align:center;line-height:1.1;user-select:none}
  .machine{background:#f7f8fa;color:#111;border:0.5cqw solid #d0d5dc;cursor:pointer;
    transition:transform .08s, box-shadow .08s;padding:0.3cqw 0.8cqw;gap:0.3cqw}
  .machine:hover{transform:scale(1.04);box-shadow:0 0 0 0.6cqw var(--accent);z-index:2}
  .machine .top{display:flex;align-items:center;justify-content:center;gap:1.2cqw;max-width:100%}
  .machine .no{font-weight:800;font-size:3.6cqw}
  .machine .owner{font-size:2.8cqw;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .machine .pay{font-size:2.5cqw;font-weight:700;color:#fff;border-radius:1cqw;padding:0.2cqw 1.2cqw}
  .machine .pay.self{background:#2563eb}
  .months.disabled,.months-tools.disabled{opacity:.35;pointer-events:none}
  .machine .pay.paid{background:var(--paid)} .machine .pay.unpaid{background:var(--unpaid)}
  .machine.st-repair{background:#ede4ff;border-color:#8b5cf6;border-style:dashed}   /* 維修中：紫色虛線 */
  .machine.st-vacant{background:#fdba74;border-color:#ea580c;color:#1f1300}         /* 待承租：橘色 */
  .machine.st-vacant .owner, .machine.st-vacant .owner span{color:#5a2a00 !important}
  .floor.compact .machine .no{font-size:3.4cqw} .floor.compact .machine .pay{font-size:2.3cqw;padding:0.2cqw 0.9cqw}
  .floor.compact .machine .owner{font-size:2.6cqw} .floor.compact .machine .top{gap:0.8cqw}
  .machine.big .no{font-size:4.5cqw} .machine.big .owner{font-size:3.4cqw} .machine.big .pay{font-size:3cqw}
  .area{pointer-events:none;border-radius:0;z-index:0;font-weight:800;line-height:1}
  .blocklbl{cursor:default;z-index:1;font-weight:800;border-radius:0.6cqw}
  .machine,.exchanger{z-index:2}
  .floor.editing{background-image:linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
    background-size:5cqw 5cqw}
  .layout-edit .machine{touch-action:none;cursor:grab;outline:2px dashed #60a5fa;outline-offset:-2px}
  .layout-edit .machine.dragging{cursor:grabbing;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.5);opacity:.92}
  .layout-edit .machine.bad{outline:3px solid #ef4444}
  .machine .tools{position:absolute;top:0.4cqw;right:0.4cqw;display:flex;gap:0.6cqw}
  .machine .tools button{font-size:3cqw;line-height:1;padding:0.6cqw 1cqw;border-radius:1cqw;background:#1f2937;color:#fff;border:none;min-width:6cqw}
  .machine .tools button[data-act=del]{background:#dc2626}
  .layout-edit .machine .top{margin-top:3cqw}
  .machine.flash{animation:flash 1.2s 2}
  @keyframes flash{50%{box-shadow:0 0 0 1.2cqw #facc15}}
  .edit-bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(17,24,39,.97);border-top:1px solid var(--line)}
  .edit-bar.show{display:flex}
  .edit-bar .hint{margin-right:auto;font-size:12px;color:var(--muted)}
  .edit-bar button{font-size:15px;padding:9px 14px}
  body.layout-edit main{padding-bottom:90px}
  .menu-btn{font-size:20px;line-height:1;padding:4px 10px;margin-right:6px}
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:35;display:none}
  .drawer-bg.open{display:block}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:min(80vw,300px);background:var(--panel);border-right:1px solid var(--line);
    z-index:36;transform:translateX(-102%);transition:transform .2s;padding:14px;display:flex;flex-direction:column;gap:10px}
  .drawer.open{transform:none}
  .drawer h3{margin:0 0 4px;font-size:15px;color:var(--muted)}
  .venue{display:flex;align-items:center;gap:6px;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:#0f1318}
  .venue.cur{border-color:var(--accent);background:#14233d}
  .venue .vn{flex:1;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .venue .vc{font-size:11px;color:var(--muted)}
  .venue button{font-size:12px;padding:4px 8px}
  .exchanger{background:var(--exch);color:#fff;font-weight:800;font-size:3.6cqw;border:0.5cqw solid #ff6b6b;cursor:default;letter-spacing:.1em}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:420px;
    max-height:92vh;overflow:auto;padding:16px}
  .modal h2{margin:0 0 4px;font-size:18px}
  .modal .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .grid .full{grid-column:1/-1}
  label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
  input,select{width:100%;min-width:0;font:inherit;font-size:16px;color:var(--text);background:#0f1318;border:1px solid var(--line);
    border-radius:8px;padding:8px}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .period{max-width:640px;margin:8px auto 0;display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
  .period select{width:auto;font-size:14px;padding:4px 8px}
  .months-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .months-head select{width:auto;font-size:14px;padding:4px 8px}
  .months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:6px}
  .mchip{position:relative;display:block;text-align:center;font-size:13px;padding:8px 0;border-radius:8px;cursor:pointer;
    border:1px solid #7f2a2a;background:#2a1414;color:#fca5a5;user-select:none}
  .mchip input{position:absolute;opacity:0;pointer-events:none}
  .mchip.on{border-color:#1f6f43;background:#12301f;color:#86efac}
  .mchip.cur{box-shadow:0 0 0 2px var(--accent)}
  .mchip small{display:block;font-size:10px;opacity:.85}
  .months-tools{display:flex;gap:6px;margin-top:6px}
  .months-tools button{font-size:12px;padding:4px 8px}
  .finance{max-width:640px;margin:8px auto 0;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#151a20}
  .finance .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .finance input{width:6em;font-size:15px;padding:5px 8px}
  .finance .net{margin-top:6px;font-size:13px;line-height:1.7;color:var(--muted)}
  .finance .net b.big{font-size:17px}
  .pos{color:#4ade80} .neg{color:#f87171}
  .profit{margin-top:12px;font-size:14px;padding:8px 10px;border-radius:8px;background:#0f1318;border:1px solid var(--line)}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;color:#fff;
    padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
  .toast.show{opacity:.92}
  /* 雲端 / 登入 */
  .userbar{max-width:640px;margin:6px auto 0;display:none;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
  .userbar.show{display:flex}
  .userbar .email{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55vw}
  .sync{padding:2px 8px;border-radius:999px;border:1px solid var(--line);font-size:11px}
  .sync.ok{color:#4ade80;border-color:#1f6f43} .sync.busy{color:#fbbf24;border-color:#7a5a12} .sync.err{color:#f87171;border-color:#7f2a2a}
  .userbar button{margin-left:auto;font-size:12px;padding:4px 10px}
  .banner{max-width:640px;margin:6px auto 0;font-size:12px;color:#fbbf24;display:none}
  .banner.show{display:block}
  .login-bg{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
  .login-bg.open{display:flex}
  .login{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 20px;width:100%;max-width:360px;text-align:center}
  .login h2{margin:0 0 6px;font-size:20px}
  .login p{color:var(--muted);font-size:13px;margin:0 0 18px;line-height:1.6}
  .login .gbtn{width:100%;padding:12px;font-size:15px;background:#fff;color:#222;border:none;font-weight:600}
  .login .msg{min-height:1.4em;margin-top:12px;font-size:13px;color:#f87171;line-height:1.5}
  .login .alt{margin-top:10px;font-size:12px;background:none;border:none;color:var(--muted);text-decoration:underline}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 style="display:flex;align-items:center"><button class="menu-btn" id="btnMenu" aria-label="切換場地">☰</button><span id="venueTitle">🧸 娃娃機台平面圖</span></h1>
    <div class="actions">
      <button id="btnSaveAll" class="primary" title="把所有機台資料重新寫入雲端（合併，不會刪資料）">全部儲存</button>
      <button id="btnLayout" title="新增、移動、刪除機台">編輯佈局</button>
      <button id="btnExport">匯出 JSON</button>
      <label class="btn" style="flex-direction:row;color:var(--text)">匯入 JSON
        <input type="file" id="fileImport" accept="application/json,.json" hidden></label>
      <button id="btnReset" title="清除所有資料回到預設">重設</button>
    </div>
  </div>
  <div class="period">顯示月份：
    <select id="viewYear" aria-label="年份"></select>
    <select id="viewMonth" aria-label="月份"></select>
    <button id="btnThisMonth" style="font-size:12px;padding:4px 8px">本月</button>
  </div>
  <div class="summary" id="summary"></div>
  <div class="finance">
    <div class="row"><b style="color:var(--text);width:100%" id="finTitle"></b>店面支出：
      <label style="flex-direction:row;align-items:center;gap:4px">房租<input id="expRent" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
      <label style="flex-direction:row;align-items:center;gap:4px">電費<input id="expElec" type="number" inputmode="decimal" min="0" step="any" placeholder="0"></label>
    </div>
    <div class="net" id="netIncome"></div>
  </div>
  <div class="userbar" id="userbar">
    <span>👤 <span class="email" id="userEmail"></span></span>
    <span class="sync busy" id="syncState">連線中…</span>
    <button id="btnLogout">登出</button>
  </div>
  <div class="banner" id="banner">⚠️ 尚未設定雲端（firebaseConfig），目前為「僅本機」模式，資料只存在這台裝置。</div>
</header>
<main><div class="floor" id="floor"></div>
  <div style="text-align:center;color:#4b5563;font-size:11px;margin-top:8px">版本 2026-10-11a・共 <span id="verN"></span> 台</div></main>

<div class="modal-bg" id="modalBg">
  <div class="modal" role="dialog" aria-modal="true">
    <h2>機台後台設定</h2>
    <div class="sub" id="modalSub"></div>
    <form id="form" class="grid">
      <label>編號<input name="no" required></label>
      <label>狀態<select name="status">
        <option>營運中</option><option>維修中</option><option>待承租</option></select></label>
      <label class="full" style="flex-direction:row;align-items:center;gap:8px;color:var(--text);font-size:14px">
        <input type="checkbox" name="selfManaged" style="width:20px;height:20px;flex:none"> 未承租（自己管理）
        <span style="font-size:12px;color:var(--muted)">不收租金，營收／成本計入店的淨收入</span></label>
      <label class="full">台主名字<input name="owner" placeholder="例：王小明"></label>
      <label>台主租金 (元)<input name="rent" type="number" inputmode="decimal" min="0" step="any"></label>
      <div class="full">
        <div class="months-head"><label style="flex-direction:row;align-items:center;gap:6px">每月租金繳納
          <select id="edYear" aria-label="年份"></select></label></div>
        <div class="months" id="edMonths"></div>
        <div class="months-tools"><button type="button" id="btnAllPaid">全部已繳</button><button type="button" id="btnNonePaid">全部未繳</button><span id="edPaidCount" style="font-size:12px;color:var(--muted);align-self:center"></span></div>
      </div>
      <div class="full months-head" style="font-size:13px;color:var(--muted)">
        <span>每月營收／成本：<span id="edYearLabel"></span></span>
        <select id="edMonth" aria-label="營收成本月份"></select></div>
      <label>成本 (元)<input name="cost" type="number" inputmode="decimal" step="any"></label>
      <label>營收 (元)<input name="revenue" type="number" inputmode="decimal" step="any"></label>
    </form>
    <div class="profit" id="profit"></div>
    <div class="foot">
      <button type="button" id="btnCancel">取消</button>
      <button type="button" class="primary" id="btnSave">儲存</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<div class="edit-bar" id="editBar">
  <span class="hint">編輯佈局：拖曳移動・⤢ 大小・✕ 刪除</span>
  <button id="btnAddMachine">＋新增機台</button>
  <button id="btnLayoutDone" class="primary">完成</button>
</div>

<div class="drawer-bg" id="drawerBg"></div>
<nav class="drawer" id="drawer" aria-label="場地選單">
  <div style="display:flex;align-items:center;justify-content:space-between"><b style="font-size:17px">🧸 場地</b><button id="btnMenuClose">✕</button></div>
  <h3>點選切換場地；「改名」可修改名稱（存到雲端）</h3>
  <div id="venueList" style="display:flex;flex-direction:column;gap:8px"></div>
  <button id="btnMenuLayout" style="margin-top:6px;padding:10px">🛠️ 編輯此場地的佈局</button>
</nav>

<div class="login-bg" id="loginBg">
  <div class="login">
    <h2>🧸 娃娃機台平面圖</h2>
    <p>此頁面僅限店主使用。<br>請用授權的 Google 帳號登入。</p>
    <button class="gbtn" id="btnLogin">使用 Google 帳號登入</button>
    <button class="alt" id="btnLoginRedirect">登入視窗沒有出現？改用整頁登入</button>
    <button class="alt" id="btnLoginOther" style="display:none">登出並改用其他帳號</button>
    <div class="msg" id="loginMsg"></div>
  </div>
</div>

<script type="module">
/* =====================================================================
 * 🔧 Firebase 設定（請貼上 Firebase 主控台 → 專案設定 → 你的應用程式 → SDK 設定 裡的 firebaseConfig）
 *    保留 'PASTE_...' 的話，頁面會以「僅本機」模式執行（資料只存在這台裝置）。
 *    注意：apiKey 不是密碼，可以公開；真正的保護來自 firestore.rules。
 * ===================================================================== */
const firebaseConfig = {
  apiKey:            "AIzaSyBbiycotwBaRLFhnknAbrhSPIg3VmA4SN4",
  authDomain:        "claw-floorplan-9bb73.firebaseapp.com",
  projectId:         "claw-floorplan-9bb73",
  storageBucket:     "claw-floorplan-9bb73.firebasestorage.app",
  messagingSenderId: "1013569430626",
  appId:             "1:1013569430626:web:71aa004fdbc08bb3a11d3b",
};
// 允許的帳號（只影響畫面提示；真正的權限由 firestore.rules 決定，兩邊要一致）
const OWNER_EMAILS = ["qew59601211@gmail.com"];
// 每個場地一份文件：floorplans/main（來都來了）、floorplans/venue2（大寮貓抓）；場地名稱在 floorplans/_meta
const FB_VER = "13.0.0";
/* ===================================================================== */

const CLOUD = !Object.values(firebaseConfig).some(v => String(v).includes("PASTE_"));
const LOCAL_KEY = 'clawFloorplan.v1';            // 僅本機模式 / 舊資料
const CACHE_KEY = 'clawFloorplan.cloudCache.v1'; // 雲端模式的本機快取（登出時清除）

  // ===================== 場地 =====================
  // 每個場地有自己的 Firestore 文件與本機快取；場地名稱存在 floorplans/_meta
  const VENUES = [
    {id:'main',   doc:'main',   defaultName:'來都來了', build: buildLayoutMain, localKey:LOCAL_KEY, cacheKey:CACHE_KEY},
    {id:'venue2', doc:'venue2', defaultName:'大寮貓抓', build: buildLayoutVenue2, localKey:LOCAL_KEY+'.venue2', cacheKey:CACHE_KEY+'.venue2'},
  ];
  const VENUE_KEY = 'clawFloorplan.venue';
  const NAMES_KEY = 'clawFloorplan.venueNames';
  const VENUE = VENUES.find(v=>v.id===localStorage.getItem(VENUE_KEY)) || VENUES[0];
  let venueNames = {}; try{ venueNames = JSON.parse(localStorage.getItem(NAMES_KEY))||{}; }catch(e){}
  const venueName = v => (venueNames[v.id] || v.defaultName);
  const BUILT = VENUE.build();
  const {W, floorBg} = BUILT, S0 = BUILT.S, BIG0 = BUILT.BIG, baseH = BUILT.H;
  const statics = BUILT.layout.filter(l=>l.type!=='machine');       // 兌幣機、區域、電腦、樓梯…（不可編輯）
  const baseSlots = BUILT.layout.filter(l=>l.type==='machine');     // 預設機台位置
  // 自訂佈局（存在雲端 layoutOv）：{ "<內部位置>": {x,y,w,h, no?, added?, deleted?} }；沒有的就用預設位置
  let layoutOv = {};
  let machineSlots = [], N = 0, H = baseH, layoutEditing = false;
  function cleanLayoutOv(o){
    const out = {};
    if(o && typeof o==='object') for(const [k,v] of Object.entries(o)){
      if(!/^\d+$/.test(k) || !v || typeof v!=='object') continue;
      const r = {};
      for(const f of ['x','y','w','h']) if(Number.isFinite(+v[f]) && v[f]!=='' && v[f]!=null) r[f] = Math.round(+v[f]*10)/10;
      if(typeof v.no==='string') r.no = v.no;
      if(v.added===true) r.added = true;
      if(v.deleted===true) r.deleted = true;
      out[k] = r;
    }
    return out;
  }
  function computeSlots(){
    const L = Math.max(baseSlots.length, ...Object.keys(layoutOv).map(k=>+k+1));
    machineSlots = [];
    for(let i=0;i<L;i++){
      const b = baseSlots[i], o = layoutOv[String(i)];
      let sl;
      if(b) sl = {...b};
      else if(o && o.added) sl = {type:'machine', x:0, y:0, w:S0, h:S0};
      else sl = {type:'machine', x:0, y:0, w:S0, h:S0, deleted:true};
      if(o){ for(const f of ['x','y','w','h','no']) if(o[f]!=null) sl[f] = o[f]; if(o.deleted) sl.deleted = true; }
      sl.big = sl.w > S0 + 1;
      machineSlots.push(sl);
    }
    const live = machineSlots.filter(x=>!x.deleted);
    N = live.length;
    H = Math.max(baseH, ...live.map(x=>x.y+x.h+6)) + (layoutEditing ? S0 + 20 : 0);
  }
  computeSlots();
  const isLive = i => machineSlots[i] && !machineSlots[i].deleted;
  const act = () => machines.filter((_,i)=>isLive(i));

  // ---- 場地一「來都來了」：座標系寬 400（所有機台皆為正方形）----
  function buildLayoutMain(){
    const W = 400, S = 74, BIG = 104, GAP = 5;   // S=一般機台邊長, BIG=右下大型機邊長
    const layout = [];   // {type:'machine'|'exchanger', x,y,w,h, big}
    function column(x, y0, n, size=S, opts={}){
      for(let i=0;i<n;i++) layout.push({type:'machine', x, y:y0 + i*(size+GAP), w:size, h:size, big:!!opts.big});
      return y0 + n*(size+GAP);   // 下一個可用 y
    }
    const LX = 18, CX = (W-S)/2, RX = W-18-S;
    // 左排：8 台 → 兌幣機 → 5 台
    let y = column(LX, 92, 8);
    layout.push({type:'exchanger', x:LX-8, y:y+3, w:S+16, h:56});
    column(LX, y+67, 5);
    // 中間：4 組上下相疊的 2 台
    // 4 組平均分布：從上方靠牆機台下方，到左排「兌幣機下方第 4 台」底部為止，組與組間距相等
    { const left = layout.filter(l=>l.type==='machine');
      const top = 150, bottom = left[11].y + S, pairH = 2*S + GAP;
      const gap = (bottom - top - 4*pairH) / 3;
      for(let k=0;k<4;k++) column(CX, top + k*(pairH+gap), 2); }
    // 右排：7 台 → 兌幣機 → 5 台 → 2 台大型機
    y = column(RX, 122, 7);
    layout.push({type:'exchanger', x:RX-8, y:y+3, w:S+16, h:56});
    const slot39 = {x:RX, y:y+67};             // 預留：兌幣機正下方給後來新增的 #39（預設編號 28）
    y = column(RX, y+67+S+GAP, 5);
    y = column(W-12-BIG, y+3, 2, BIG, {big:true});
    // 上方靠牆：3 台並排（放在陣列最後 → 編號 36–38，不影響既有資料順序）
    { const n=3, x0=(W-(n*S+(n-1)*GAP))/2;
      for(let i=0;i<n;i++) layout.push({type:'machine', x:x0+i*(S+GAP), y:6, w:S, h:S}); }
    // 後來新增（放在陣列最後 → 內部位置 #39、#40，不影響既有資料）
    { const ms = layout.filter(l=>l.type==='machine');
      const leftLast = ms[12];   // 左排最下面一台
      layout.push({type:'machine', x:slot39.x, y:slot39.y, w:S, h:S});   // #39：右排兌幣機正下方、29 號上方（預設編號 28）
      layout.push({type:'machine', x:leftLast.x, y:leftLast.y+S+GAP, w:S, h:S});    // #40：左排最下面一台的正下方（預設編號 2）
    }
    const H = Math.max(...layout.map(l=>l.y+l.h)) + 6;   // 平面圖高度 = 最下方物件 + 邊距


    // 新增機台的預設顯示編號（可重複，可在後台修改）
    const ms = layout.filter(l=>l.type==='machine'); ms[38].no = '28'; ms[39].no = '2';
    return {layout, W, H, S, BIG, floorBg:'#0b0d10'};
  }

  // ---- 場地二「大寮貓抓」：依照配置圖（藍＝室外、綠＝室內）----

    // 樓梯旁：2

    m(4, CX, 245); m(6, CX+S+G, 245);
    m(5, CX, 310); m(7, CX+S+G, 310);

    const AX = 70, BX = AX+S+G;
    [16,17,18,19].forEach((n,k)=> m(n, AX, 180+k*(S+G)));
    [9,10,11,12].forEach((n,k)=> m(n, BX, 185+k*(S+G)));
    // 下方：20 23 / 21 22
    m(20, AX, 520); m(23, BX, 520); m(21, AX, 585); m(22, BX, 585);
    // 右側室外：24、25、26
    [24,25,26].forEach((n,k)=> m(n, W-S, 455+k*(S+G)));
    const H = Math.max(...layout.map(l=>l.y+l.h)) + 6;

  const DEF = i => ({no:machineSlots[i].no ?? String(i+1), status:'營運中', owner:'', rent:'', selfManaged:false, rentPaid:{}, revenueByMonth:{}, costByMonth:{}});
  const FIELDS = ['no','status','owner','rent'];
  // revenueByMonth / costByMonth 結構：{ "2026": { "1":"5600", ..., "12":"" } }（金額以字串存，空字串＝未填）
  const num = v => (v===''||v==null||isNaN(+v)) ? 0 : +v;
  const getMon = (map,y,mo) => (map && map[String(y)] && map[String(y)][String(mo)]) ?? '';
  function cleanMoneyMap(mp){
    const out = {};
    if(mp && typeof mp==='object') for(const [y,months] of Object.entries(mp)){
      if(!/^\d{4}$/.test(y) || !months || typeof months!=='object') continue;
      out[y] = {}; for(let k=1;k<=12;k++){ const v = months[String(k)]; out[y][String(k)] = (v==null ? '' : String(v)).trim(); }
    }
    return out;
  }
  const emptyYear = fill => Object.fromEntries([...Array(12)].map((_,k)=>[String(k+1), fill]));
  // 店面支出：shopExpenses = { "2026": { "10": {rent:"", electricity:""} } }
  let shopExpenses = {};
  function cleanExpenses(e){
    const out = {};
    if(e && typeof e==='object') for(const [y,months] of Object.entries(e)){
      if(!/^\d{4}$/.test(y) || !months || typeof months!=='object') continue;
      for(const [mo,v] of Object.entries(months)){
        if(!/^(1[0-2]|[1-9])$/.test(mo) || !v || typeof v!=='object') continue;
        (out[y] = out[y] || {})[mo] = {rent: String(v.rent??'').trim(), electricity: String(v.electricity??'').trim()};
      }
    }
    return out;
  }
  const NOW = new Date(), CUR_Y = NOW.getFullYear(), CUR_M = NOW.getMonth()+1;
  let viewY = CUR_Y, viewM = CUR_M;
  // rentPaid 結構：{ "2026": { "1":true, "2":false, ... "12":false } }
  const isPaid = (m,y,mo) => !!(m.rentPaid && m.rentPaid[String(y)] && m.rentPaid[String(y)][String(mo)]);
  function cleanRentPaid(rp){
    const out = {};
    if(rp && typeof rp==='object') for(const [y,months] of Object.entries(rp)){
      if(!/^\d{4}$/.test(y) || !months || typeof months!=='object') continue;
      out[y] = {}; for(let k=1;k<=12;k++) out[y][String(k)] = !!months[String(k)];
    }
    return out;
  }
  function defaults(){ return machineSlots.map((_,i)=>DEF(i)); }
  // 接受陣列或 {"0":{...},"1":{...}} 物件，補齊缺少的機台
  function normalize(src){
    return machineSlots.map((_,i)=>{
      const m = Object.assign(DEF(i), (src && src[i]) || (src && src[String(i)]) || {});
      const out = {}; FIELDS.forEach(k=> out[k] = m[k]==null ? '' : String(m[k]));
      out.rentPaid = cleanRentPaid(m.rentPaid);
      out.selfManaged = m.selfManaged===true;
      if(out.status==='閒置') out.status = '待承租';   // 舊名稱遷移（下次儲存時寫回雲端）
      out.revenueByMonth = cleanMoneyMap(m.revenueByMonth);
      out.costByMonth = cleanMoneyMap(m.costByMonth);
      // 舊資料遷移：單一「營收／成本」→ 記到目前月份（只在尚無每月資料時遷移一次）
      for(const [old, key] of [['revenue','revenueByMonth'], ['cost','costByMonth']]){
        const v = m[old]==null ? '' : String(m[old]).trim();
        if(v!=='' && Object.keys(out[key]).length===0){ out[key][String(CUR_Y)] = emptyYear(''); out[key][String(CUR_Y)][String(CUR_M)] = v; }
      }
      // 舊資料遷移：單一「已繳」→ 記為目前月份已繳
      if(m.paid==='已繳' && Object.keys(out.rentPaid).length===0){   // 只在尚無每月資料時遷移一次
        const y = String(CUR_Y); out.rentPaid[y] = out.rentPaid[y] || Object.fromEntries([...Array(12)].map((_,k)=>[String(k+1),false]));
        out.rentPaid[y][String(CUR_M)] = true;
      }
      return out;
    });
  }
  const toMap = arr => Object.fromEntries(arr.map((m,i)=>[String(i), m]));
  function readStore(key){
    try{ const d = JSON.parse(localStorage.getItem(key)); if(d && d.machines){
      if(d.shopExpenses) shopExpenses = cleanExpenses(d.shopExpenses);
      if(d.layoutOv){ layoutOv = cleanLayoutOv(d.layoutOv); computeSlots(); }
      return normalize(d.machines); } }catch(e){}
    return null;
  }
  function writeCache(){
    localStorage.setItem(CLOUD ? VENUE.cacheKey : VENUE.localKey, JSON.stringify({version:5, savedAt:new Date().toISOString(), machines, shopExpenses, layoutOv}));
  }

  let machines = (CLOUD ? readStore(VENUE.cacheKey) : readStore(VENUE.localKey)) || defaults();

  const $ = id => document.getElementById(id);

  if(VENUE.id!=='main'){ floor.style.borderRadius = '4px'; floor.style.border = '2px solid #9ca3af'; }
  const pct = (v,t)=> (v/t*100)+'%';
  const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = v => (v===''||v==null||isNaN(+v)) ? '—' : (+v).toLocaleString('zh-TW');

  function render(){
    floor.innerHTML = '';
    floor.style.aspectRatio = `${W} / ${H}`;
    floor.classList.toggle('editing', layoutEditing);
    const items = [...statics.map(l=>({l, idx:-1})), ...machineSlots.map((l,i)=>({l, idx:i})).filter(x=>!x.l.deleted)];
    items.forEach(({l, idx})=>{
      const el = document.createElement('div');
      el.className = 'item ' + l.type;
      Object.assign(el.style, {left:pct(l.x,W), top:pct(l.y,H), width:pct(l.w,W), height:pct(l.h,H)});
      if(l.type==='area' || l.type==='block' || (l.type==='exchanger' && l.label)){
        if(l.bg) el.style.background = l.bg;
        if(l.border) el.style.border = `0.5cqw solid ${l.border}`;

      else{

        if(m.status==='待承租') el.classList.add('st-vacant');

          <span class="pay ${self?'self':paid?'paid':'unpaid'}">${self?'自管':paid?'已繳':'未繳'}</span></div>
          <div class="owner">${m.owner ? esc(m.owner) : '<span style="color:#999">未設定</span>'}</div>`;
        el.title = `${m.no} 號機｜${m.status}｜${self?'自己管理':`${viewY}年${viewM}月 ${paid?'已繳':'未繳'}`}`;
        el.tabIndex = 0;
        el.addEventListener('click', ()=>{ if(!layoutEditing) openEditor(idx); });
        el.addEventListener('keydown', e=>{ if(e.key==='Enter' && !layoutEditing) openEditor(idx); });
        if(layoutEditing){
          el.insertAdjacentHTML('beforeend', `<div class="tools"><button data-act="size" title="切換大小">⤢</button><button data-act="del" title="刪除機台">✕</button></div>`);
          el.addEventListener('pointerdown', e=> startDrag(e, idx, el));
          el.querySelector('[data-act=del]').addEventListener('click', e=>{ e.stopPropagation(); deleteMachine(idx); });
          el.querySelector('[data-act=size]').addEventListener('click', e=>{ e.stopPropagation(); toggleSize(idx); });
        }
      }
      floor.appendChild(el);
    });
    renderSummary();
    if($('verN')) $('verN').textContent = N;
  }
  function monthTotals(y, mo){
    const rented = act().filter(m=>!m.selfManaged), self = act().filter(m=>m.selfManaged);
    const rentIn = rented.filter(m=>isPaid(m,y,mo)).reduce((a,m)=>a+num(m.rent),0);   // 已收台主租金
    const sumMon = (list,key) => list.reduce((a,m)=>a+num(getMon(m[key],y,mo)),0);
    const selfRev = sumMon(self,'revenueByMonth'), selfCost = sumMon(self,'costByMonth');      // 自管：計入
    const rev = sumMon(rented,'revenueByMonth'), cost = sumMon(rented,'costByMonth');          // 台主：不計入
    const ex = (shopExpenses[String(y)]||{})[String(mo)] || {};
    const shopRent = num(ex.rent), elec = num(ex.electricity);
    return {rentIn, selfRev, selfCost, rev, cost, shopRent, elec, net: rentIn + selfRev - selfCost - shopRent - elec};   // 出租機台的營收屬於台主，不計入
  }
  function renderSummary(){
    const rented = act().filter(m=>!m.selfManaged), nSelf = N - rented.length;
    const paid = rented.filter(m=>isPaid(m,viewY,viewM)).length;
    const due = rented.filter(m=>!isPaid(m,viewY,viewM)).reduce((a,m)=>a+num(m.rent),0);
    const arrears = rented.reduce((a,m)=>{ let n=0; for(let k=1;k<=viewM;k++) if(!isPaid(m,viewY,k)) n++; return a + num(m.rent)*n; },0);
    const t = monthTotals(viewY, viewM);
    $('summary').innerHTML =
      `<span><b>${viewY}年${viewM}月</b></span>
       <span>機台 <b>${N}</b> 台</span>
       <span><i class="dot" style="background:var(--paid)"></i>已繳 <b>${paid}</b></span>
       <span><i class="dot" style="background:#2563eb"></i>自管 <b>${nSelf}</b></span>
       <span><i class="dot" style="background:var(--unpaid)"></i>未繳 <b>${rented.length-paid}</b>（本月待收 <b>${money(due)}</b> 元）</span>
       <span>${viewY}年 1–${viewM}月累計未繳 <b>${money(arrears)}</b> 元</span>`;
    $('finTitle').textContent = `${viewY}年${viewM}月`;

       <span style="font-size:12px;color:#6b7280">機台營收/成本（台主，不計入）：營收 ${f(t.rev)}・成本 ${f(t.cost)}</span>`;
  }

  // ---- 年份 / 月份選擇 ----
  function yearOptions(extra=[]){
    const ys = new Set([CUR_Y-1, CUR_Y, CUR_Y+1, viewY, ...extra]);
    machines.forEach(m=> [m.rentPaid, m.revenueByMonth, m.costByMonth].forEach(mp=> Object.keys(mp||{}).forEach(y=> ys.add(+y))));

  // ---- 儲存層：僅本機 or Firestore ----
  let cloud = null;   // {db, ref, setDoc, serverTimestamp, user}
  function setSync(state, text){ const el=$('syncState'); el.className='sync '+state; el.textContent=text; }

  const GRID = 5;   // 對齊格線（平面圖單位）
  const snapTo = v => Math.round(v/GRID)*GRID;
  const rectOf = l => ({x:l.x, y:l.y, w:l.w, h:l.h});
  const hit = (a,b) => a.x < b.x+b.w-0.5 && b.x < a.x+a.w-0.5 && a.y < b.y+b.h-0.5 && b.y < a.y+a.h-0.5;
  function overlapsAny(r, skipIdx){
    for(const l of statics) if((l.type==='exchanger' || l.type==='block' || l.obstacle) && hit(r, l)) return true;
    return machineSlots.some((l,i)=> i!==skipIdx && !l.deleted && hit(r, l));

    catch(err){ cloudError(err, '佈局儲存失敗'); }
  }
  function setSlot(idx, patch){
    const k = String(idx), sl = machineSlots[idx];
    layoutOv[k] = {...(layoutOv[k]||{}), x:sl.x, y:sl.y, w:sl.w, h:sl.h, ...patch};
    computeSlots();
  }
  let drag = null;
  function startDrag(e, idx, el){
    if(!layoutEditing || e.target.closest('.tools') || e.button>0) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const sl = machineSlots[idx], u = W / floor.getBoundingClientRect().width;
    drag = {idx, el, sx:e.clientX, sy:e.clientY, ox:sl.x, oy:sl.y, w:sl.w, h:sl.h, u, x:sl.x, y:sl.y, moved:false};
    el.classList.add('dragging');
  }
  floor.addEventListener('pointermove', e=>{
    if(!drag) return;
    const dx = (e.clientX-drag.sx)*drag.u, dy = (e.clientY-drag.sy)*drag.u;
    if(Math.abs(dx)+Math.abs(dy) > 2) drag.moved = true;
    drag.x = Math.min(Math.max(0, snapTo(drag.ox+dx)), W-drag.w);
    drag.y = Math.min(Math.max(0, snapTo(drag.oy+dy)), H-drag.h);
    drag.el.style.left = pct(drag.x,W); drag.el.style.top = pct(drag.y,H);
    drag.el.classList.toggle('bad', overlapsAny({x:drag.x, y:drag.y, w:drag.w, h:drag.h}, drag.idx));
  });
  function endDrag(){
    if(!drag) return;
    const d = drag; drag = null;
    if(!d.moved){ render(); return; }
    if(overlapsAny({x:d.x, y:d.y, w:d.w, h:d.h}, d.idx)){ toast('位置和其他物件重疊，已還原'); render(); return; }
    setSlot(d.idx, {x:d.x, y:d.y}); render(); persistLayout(d.idx);
  }

  function findFreeSpot(w, h){
    for(let y=0; y<=H-h; y+=GRID) for(let x=0; x<=W-w; x+=GRID){ const r={x,y,w,h}; if(!overlapsAny(r, -1)) return r; }
    return {x:0, y:Math.max(...machineSlots.filter(l=>!l.deleted).map(l=>l.y+l.h), baseH) + GRID, w, h};
  }

  async function initCloud(){
    showLogin('載入中…');
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}`;
    const [{initializeApp}, A, F] = await Promise.all([
      import(`${base}/firebase-app.js`), import(`${base}/firebase-auth.js`), import(`${base}/firebase-firestore.js`)]);
    const app = initializeApp(firebaseConfig);
    const auth = A.getAuth(app);
    auth.languageCode = 'zh-TW';
    const db = F.getFirestore(app);
    const ref = F.doc(db, 'floorplans', VENUE.doc);
    const metaRef = F.doc(db, 'floorplans', '_meta');
    cloudMeta = {setDoc:F.setDoc, metaRef};
    const provider = new A.GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    let unsub = null, unsubMeta = null;

    $('loginMsg').textContent = '';
    A.getRedirectResult(auth).catch(err=> showLogin('登入失敗：' + (err.code||err.message)));

    // iOS App（Capacitor）內：用原生 Google 登入，再把 idToken 交給網頁 Firebase（網頁版行為不變）
    const CAP = window.Capacitor;
    const NATIVE_AUTH = !!(CAP && CAP.isNativePlatform && CAP.isNativePlatform() && CAP.Plugins && CAP.Plugins.FirebaseAuthentication) ? CAP.Plugins.FirebaseAuthentication : null;
    if(NATIVE_AUTH){
      $('btnLoginRedirect').style.display = 'none';
      $('btnLoginRedirect').dataset.native = '1';
      $('btnLogin').onclick = async ()=>{
        $('loginMsg').textContent = '';
        try{
          const res = await NATIVE_AUTH.signInWithGoogle();
          const idToken = res && res.credential && res.credential.idToken;
          if(!idToken) throw new Error('沒有取得 Google 憑證');
          await A.signInWithCredential(auth, A.GoogleAuthProvider.credential(idToken, res.credential.accessToken || null));
        }catch(err){
          const m = String((err && (err.code||err.message)) || err);
          if(!/cancel/i.test(m)) showLogin('登入失敗：' + m);
        }
      };
    }
    const STANDALONE = !NATIVE_AUTH && (matchMedia('(display-mode: standalone)').matches || navigator.standalone === true);
    const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    if(STANDALONE && IOS) $('loginMsg').innerHTML = '<span style="color:var(--muted)">主畫面 App 模式：若登入視窗無法完成，請改用 Safari 開啟網址登入使用。</span>';
    if(!NATIVE_AUTH) $('btnLogin').onclick = async ()=>{
      $('loginMsg').textContent = '';
      try{ await A.signInWithPopup(auth, provider); }
      catch(err){
        if(err.code==='auth/popup-blocked' || err.code==='auth/operation-not-supported-in-this-environment' || err.code==='auth/web-storage-unsupported'){
          await A.signInWithRedirect(auth, provider);
        } else if(err.code!=='auth/popup-closed-by-user' && err.code!=='auth/cancelled-popup-request'){
          showLogin('登入失敗：' + (err.code||err.message));
        }
      }
    };
    $('btnLoginRedirect').onclick = ()=> A.signInWithRedirect(auth, provider);
    const logout = async ()=>{
      if(unsub){ unsub(); unsub = null; }
      if(unsubMeta){ unsubMeta(); unsubMeta = null; }
      cloud = null;
      VENUES.forEach(v=> localStorage.removeItem(v.cacheKey));   // 登出時清除這台裝置上所有場地的資料快取
      machines = defaults(); render();
      await A.signOut(auth);
      if(NATIVE_AUTH){ try{ await NATIVE_AUTH.signOut(); }catch(e){} }
    };
    $('btnLogout').onclick = ()=>{ if(confirm('確定要登出嗎？')) logout(); };
    $('btnLoginOther').onclick = logout;

    A.onAuthStateChanged(auth, user=>{
      if(unsub){ unsub(); unsub = null; }
      if(!user){ cloud = null; $('userbar').classList.remove('show'); showLogin(); return; }
      const email = (user.email||'').toLowerCase();
      if(!OWNER_EMAILS.map(e=>e.toLowerCase()).includes(email)){
        cloud = null;
        showLogin(`「${user.email}」沒有使用權限，請改用店主帳號登入。`, true);
        return;
      }
      cloud = {db, ref, setDoc:F.setDoc, serverTimestamp:F.serverTimestamp, deleteField:F.deleteField, user};
      $('userEmail').textContent = user.email;
      $('userbar').classList.add('show');
      setSync('busy','同步中…');
      hideLogin();
      let first = true, migrated = false;
      if(unsubMeta) unsubMeta();
      unsubMeta = F.onSnapshot(metaRef, snap=>{ if(snap.exists()) applyRemoteNames(snap.data().names); }, err=> console.warn('meta', err.code));
      unsub = F.onSnapshot(ref, {includeMetadataChanges:true}, snap=>{
        if(!snap.exists()){
          if(first){
            first = false;
            // 第一次使用：把這台裝置上的舊資料（或預設值）上傳到雲端
            const legacy = readStore(VENUE.localKey);
            if(legacy) machines = legacy;
            persistAll().then(()=> toast(legacy ? '已將本機資料上傳到雲端' : '已建立雲端資料'));
          }
          return;
        }
        first = false;
        const d = snap.data();
        if((editing<0 || !snap.metadata.hasPendingWrites) && !drag){
          layoutOv = cleanLayoutOv(d.layoutOv || {}); computeSlots();
          machines = normalize(d.machines || {});
          shopExpenses = cleanExpenses(d.shopExpenses || {});
          // 雲端還有舊版欄位（單一營收／成本／已繳）→ 自動寫回一次新格式（合併寫入，不刪其他資料）
          if(!migrated && !snap.metadata.hasPendingWrites && Object.values(d.machines||{}).some(x=> x && ('revenue' in x || 'cost' in x || 'paid' in x))){
            migrated = true; saveAllMerge(true).then(()=> toast('已將營收／成本轉換為每月格式'));
          }
          writeCache();
          if(editing<0) render(); else renderSummary();
        }
        if(snap.metadata.hasPendingWrites) setSync('busy','儲存中…');
        else if(snap.metadata.fromCache) setSync('busy','離線（使用快取）');
        else setSync('ok','✓ 已同步');
      }, err=>{
        if(err.code==='permission-denied'){
          cloud = null;
          localStorage.removeItem(VENUE.cacheKey);
          machines = defaults(); render();
          showLogin(`「${user.email}」沒有讀取權限（請確認 Firestore 規則中的 Email）。`, true);
        } else cloudError(err, '同步失敗');
      });
    });
  }
</script>
</body>
</html>
